# ╭───────────────────────────────────────────────────────────╮
# │  Starship · ObraXRAY · minimal two-line                   │
# │  Line 1: path · git · (runtime/duration right-aligned)      │
# │  Line 2: ❯ prompt (mint / red ✘ on error)                 │
# ╰───────────────────────────────────────────────────────────╯
palette = "obraxray"
add_newline = true
command_timeout = 800

format = """
$directory$git_branch$git_status$fill$nodejs$cmd_duration
$character"""

[palettes.obraxray]
fg    = "#dce9df"
light = "#a9cbb6"
mint  = "#7fd1a8"
sand  = "#e3c58a"
clay  = "#e8a68f"
sky   = "#8fbfd0"
red   = "#e0705c"
gray  = "#6e9b83"
dim   = "#4a6e60"

[directory]
style = "light bold"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
read_only_style = "dim"

[directory.substitutions]
"~/Development" = "~/dev"

[git_branch]
symbol = " "
style = "sky"
format = "[$symbol$branch]($style) "

[git_status]
style = "sand"
format = "[$all_status$ahead_behind]($style)"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "? "
stashed = "≡ "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

[fill]
symbol = " "

# Runtime versions: dim, right-aligned, only when relevant. Low noise.
[nodejs]
symbol = " "
style = "mint"
format = "[$symbol($version)]($style) "
detect_files = ["package.json", ".nvmrc"]
detect_folders = ["node_modules"]

[cmd_duration]
min_time = 2000
style = "clay"
format = "[ $duration]($style)"

[character]
success_symbol = "[❯](mint bold)"
error_symbol = "[✘](red bold)"
vimcmd_symbol = "[❮](sky)"

# Everything else off — keep the line quiet.
[package]
disabled = true
[python]
disabled = true
[golang]
disabled = true
[rust]
disabled = true
[php]
disabled = true
[docker_context]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
