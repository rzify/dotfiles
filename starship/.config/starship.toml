palette = "noir"
add_newline = true
command_timeout = 800

format = """
[░▒▓](light)\
$os\
[](bg:raised fg:light)\
$directory\
[](fg:raised bg:line)\
$git_branch\
[](fg:line)\
$fill\
$nodejs\
$cmd_duration
$character"""

[palettes.noir]
white  = "#ffffff"
fg     = "#e6e6e6"
light  = "#b3b3b3"
gray   = "#888888"
dim    = "#555555"
raised = "#333333"
line   = "#1a1a1a"
black  = "#000000"
red    = "#e5534b"

[os]
disabled = false
style = "bg:light fg:black"
format = "[$symbol]($style)"

[os.symbols]
Macos = " "

[directory]
style = "bg:raised fg:white bold"
format = "[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
read_only_style = "bg:raised fg:gray"

[directory.substitutions]
"~/Development" = "~/dev"

[git_branch]
symbol = " "
style = "bg:line fg:light"
format = "[ $symbol$branch ]($style)"

[git_status]
disabled = true

[fill]
symbol = " "

[nodejs]
symbol = " "
style = "dim"
format = "[$symbol($version) ]($style)"
detect_files = ["package.json", ".nvmrc"]
detect_folders = ["node_modules"]

[cmd_duration]
min_time = 2000
style = "gray"
format = "[ $duration]($style)"

[character]
success_symbol = "[❯](white bold)"
error_symbol = "[❯](red bold)"
vimcmd_symbol = "[❮](gray)"

[package]
disabled = true
[python]
disabled = true
[golang]
disabled = true
[rust]
disabled = true
[php]
disabled = true
[docker_context]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
